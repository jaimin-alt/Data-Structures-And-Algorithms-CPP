name: 📊 Generate DSA Contribution Heatmap

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC
  workflow_dispatch:

jobs:
  generate-heatmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need full git log for all commit dates

      - name: Generate Heatmap SVG
        run: python3 scripts/generate_heatmap.py

      - name: Commit Heatmap (only if changed)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Heatmap Bot]"
          git add assets/contribution-graph.svg
          git diff --staged --quiet && echo "No changes." || \
            (git commit -m "chore: regenerate DSA contribution heatmap" && git push)
