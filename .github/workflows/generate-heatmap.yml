name: 📊 Generate DSA Contribution Heatmap

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 0 * * *'   # Daily at midnight UTC
  workflow_dispatch:

jobs:
  generate-heatmap:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need full history for all commit dates

      - name: Generate Heatmap SVG
        run: |
          mkdir -p assets
          python3 << 'EOF'
          import subprocess, datetime, os

          # ── Get all commit dates from THIS repo ──────────────────────
          result = subprocess.run(
              ['git', 'log', '--format=%ad', '--date=format:%Y-%m-%d'],
              capture_output=True, text=True
          )
          raw_dates = result.stdout.strip().split('\n')
          date_counts = {}
          for d in raw_dates:
              d = d.strip()
              if not d:
                  continue
              try:
                  dt = datetime.date.fromisoformat(d)
                  date_counts[dt] = date_counts.get(dt, 0) + 1
              except Exception:
                  pass

          print(f"Found {sum(date_counts.values())} commits across {len(date_counts)} days.")

          # ── Layout constants ─────────────────────────────────────────
          today      = datetime.date.today()
          WEEKS      = 53   # 53 ensures today is always inside the grid
          CELL       = 11
          GAP        = 2
          LEFT       = 38
          TOP        = 46   # Extra room: title row (0-22) + month labels (22-46)
          STEP       = CELL + GAP
          WIDTH      = LEFT + (WEEKS + 1) * STEP + 14
          HEIGHT     = TOP + 7 * STEP + 32

          # Start = 53 weeks ago, aligned to Monday
          start = today - datetime.timedelta(weeks=WEEKS)
          start = start - datetime.timedelta(days=start.weekday())  # Monday

          COLORS = ['#161b22', '#0e4429', '#006d32', '#26a641', '#39d353']

          def color(count):
              if count == 0: return COLORS[0]
              if count == 1: return COLORS[1]
              if count <= 3: return COLORS[2]
              if count <= 6: return COLORS[3]
              return COLORS[4]

          # ── Build SVG ────────────────────────────────────────────────
          lines = []
          lines.append(f'<svg width="{WIDTH}" height="{HEIGHT}" xmlns="http://www.w3.org/2000/svg">')
          lines.append(f'  <rect width="{WIDTH}" height="{HEIGHT}" fill="#0d1117" rx="8"/>')
          # Title — sits in its own band at the very top
          lines.append(f'  <text x="{WIDTH//2}" y="15" fill="#58a6ff" font-family="Arial,sans-serif" '
                       f'font-size="11" text-anchor="middle" font-weight="bold">'
                       f'DSA Repo — Contribution Heatmap</text>')
          # Thin separator between title and month labels
          lines.append(f'  <line x1="{LEFT-4}" y1="22" x2="{WIDTH-8}" y2="22" stroke="#21262d" stroke-width="1"/>')

          # Day labels (Mon, Wed, Fri)
          day_labels = {0:'Mon', 2:'Wed', 4:'Fri'}
          for d, label in day_labels.items():
              y = TOP + d * STEP + CELL - 1
              lines.append(f'  <text x="2" y="{y}" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">{label}</text>')

          # Month labels + cells
          last_month  = -1
          last_label_x = -999  # track x of last drawn label to prevent overlap
          for w in range(WEEKS + 1):
              for d in range(7):
                  date = start + datetime.timedelta(weeks=w, days=d)
                  if date > today:
                      continue
                  count = date_counts.get(date, 0)
                  x = LEFT + w * STEP
                  y = TOP  + d * STEP

                  # Month label — only draw if month changed AND far enough from last label
                  if d == 0 and date.month != last_month:
                      last_month = date.month
                      months = ['','Jan','Feb','Mar','Apr','May','Jun',
                                'Jul','Aug','Sep','Oct','Nov','Dec']
                      if x - last_label_x >= 22:   # skip if too cramped
                          lines.append(
                              f'  <text x="{x}" y="{TOP - 10}" fill="#8b949e" '
                              f'font-family="Arial,sans-serif" font-size="9">'
                              f'{months[date.month]}</text>')
                          last_label_x = x

                  c = color(count)
                  tip = f"{count} commit{'s' if count!=1 else ''} on {date}"
                  lines.append(
                      f'  <rect x="{x}" y="{y}" width="{CELL}" height="{CELL}" '
                      f'rx="2" fill="{c}"><title>{tip}</title></rect>')

          # Legend
          lx = LEFT
          ly = HEIGHT - 10
          lines.append(f'  <text x="{lx}" y="{ly}" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">Less</text>')
          for i, c in enumerate(COLORS):
              lines.append(f'  <rect x="{lx+26+i*14}" y="{ly-9}" width="{CELL}" height="{CELL}" rx="2" fill="{c}"/>')
          lines.append(f'  <text x="{lx+26+5*14}" y="{ly}" fill="#8b949e" font-family="Arial,sans-serif" font-size="8">More</text>')

          lines.append('</svg>')

          svg = '\n'.join(lines)
          os.makedirs('assets', exist_ok=True)
          with open('assets/contribution-graph.svg', 'w') as f:
              f.write(svg)

          print("Heatmap SVG written to assets/contribution-graph.svg")
          EOF

      - name: Commit Heatmap (only if changed)
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action [Heatmap Bot]"
          git add assets/contribution-graph.svg
          git diff --staged --quiet && echo "No changes." || \
            (git commit -m "chore: regenerate DSA contribution heatmap" && git push)
